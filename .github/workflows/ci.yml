name: CI

on:
  push:
    branches:
      - main

jobs:
  build:
    name: 'Build and Push'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [ 18, 20 ]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node | ${{matrix.node}}
        uses: actions/setup-node@v6
        with:
          node-version: ${{matrix.node}}
          cache: 'yarn'
      - run: yarn
      - run: yarn run test

      - name: Build Docker Image
        run: docker build -t rocketseat-ci-api:latest .